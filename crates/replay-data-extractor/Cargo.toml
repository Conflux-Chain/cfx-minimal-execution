[package]
name = "cfx-replay-data-extractor"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = { workspace = true }
rlp = { workspace = true }
serde = { workspace = true }
snap = { workspace = true }

bcs = "0.1.3"
byteorder = "1.5"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
hex = "0.4"
thiserror = "2.0"
toml = "0.8"

cfx-types = { workspace = true }
cfxpack = { workspace = true }
diem-crypto = { workspace = true }
diem-types = { workspace = true }
primitives = { workspace = true }
rocksdb = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[[bin]]
name = "cfx-replay-data-extractor"
path = "src/main.rs"

[[bin]]
name = "dump_pos_reward"
path = "src/bin/dump_pos_reward.rs"
