[package]
name = "cfx-minimal-mpt"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = { workspace = true }
bincode = { workspace = true }
rayon = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true }
# 2.0 alpha: const-generic inline size so arrays > 32 are allowed (the level-2
# key `SmallVec<u8, 40>` needs a 40-byte inline buffer).
smallvec = "2.0.0-alpha.12"
itertools = "0.14"
arbitrary = { version = "1.4", features = ["derive"] }
tiny-keccak = { version = "2.0", features = ["keccak"] }

[features]
verify-incremental = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[[bin]]
name = "trace_standalone"
path = "src/bin/trace_standalone.rs"
