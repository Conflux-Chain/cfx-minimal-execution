[package]
name = "cfx-minimal-mpt"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = { workspace = true }
bincode = { workspace = true }
rayon = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true }
# 2.0 alpha: const-generic inline size so arrays > 32 are allowed (the level-2
# key `SmallVec<u8, 40>` needs a 40-byte inline buffer).
smallvec = "2.0.0-alpha.12"
arbitrary = { version = "1.4", features = ["derive"] }
tiny-keccak = { version = "2.0", features = ["keccak"] }
heed = { version = "0.20", optional = true }
tempfile = { workspace = true, optional = true }

[features]
verify-incremental = []
snapshot-lmdb = ["dep:heed", "dep:tempfile"]
# Off-the-production-path instrumentation: the read-only memory survey used by
# the `ckpt-mem-survey` diagnostic bin. Compiled out of default/production builds.
mem-survey = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[[bin]]
name = "trace_standalone"
path = "src/bin/trace_standalone.rs"

[[bin]]
name = "ckpt-mem-survey"
path = "src/bin/ckpt-mem-survey.rs"
required-features = ["mem-survey"]
